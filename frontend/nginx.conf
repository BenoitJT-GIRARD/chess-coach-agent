server {
    # 8080, not 80: the image runs unprivileged and a port below 1024 needs root.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI backend (same Docker network).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Single-page application: fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
