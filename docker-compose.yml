# Chess Coach stack — orchestration.
#
# Services added incrementally as the project grows. This iteration adds the
# Milvus vector database (with its etcd + MinIO dependencies) used by the RAG
# layer (Étape 3). MongoDB and the Angular frontend come next (Étape 2bis / 5).
services:
  # --- Vector database (Milvus standalone) ---
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: chess_coach-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: chess_coach-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio_data:/data
    command: minio server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: chess_coach-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # --- Document database (interaction history) ---
  mongo:
    image: mongo:7
    container_name: chess_coach-mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Backend (FastAPI + LangGraph agent) ---
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: chess_coach-backend
    env_file: .env
    environment:
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MONGODB_URI=mongodb://mongo:27017
      - HF_HOME=/cache/huggingface
    volumes:
      - hf_cache:/cache/huggingface
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      milvus:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mongo_data:
  hf_cache:
