# Several hooks are invoked as `python -m ...` rather than through the console script pip
# generates. The launcher is an extra executable that some environments refuse to run, and
# calling the module directly checks exactly the same thing, everywhere.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
        entry: python -m pre_commit_hooks.check_toml
      - id: check-added-large-files
        entry: python -m pre_commit_hooks.check_added_large_files
        args: ["--maxkb=5120"]
      - id: check-merge-conflict
        entry: python -m pre_commit_hooks.check_merge_conflict
      - id: mixed-line-ending
        entry: python -m pre_commit_hooks.mixed_line_ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # The Python project lives under backend/, so ruff is told where its configuration is:
      # run from the root, it would otherwise lint with its own defaults.
      - id: ruff
        args: ["--fix", "--config", "backend/pyproject.toml"]
      - id: ruff-format
        args: ["--config", "backend/pyproject.toml"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        entry: python -m bandit
        args: ["-c", "backend/pyproject.toml", "-q"]
        additional_dependencies: ["bandit[toml]"]
