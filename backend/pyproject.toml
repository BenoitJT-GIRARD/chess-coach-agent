[project]
name = "chess_coach"
version = "0.1.0"
description = "Chess Coach: a LangGraph chess-opening coaching agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Benoît J. T. GIRARD", email = "53222414+BenoitJT-GIRARD@users.noreply.github.com" }]
keywords = [
    "chess",
    "openings",
    "langgraph",
    "agent",
    "rag",
    "milvus",
    "fastapi",
    "stockfish",
    "lichess",
]

dependencies = [
    # Web API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    # Chess domain
    "chess>=1.11",
    "stockfish>=3.28",
    # Agent orchestration
    "langgraph>=0.2.50",
    # The synthesis node talks to an OpenAI-compatible model.
    "langchain-openai>=0.2.10",
    # Retrieval-Augmented Generation
    "pymilvus>=2.4",
    "sentence-transformers>=3.3",
    # PyTorch backs sentence-transformers. It is listed here on purpose: being a
    # direct dependency is what lets [tool.uv.sources] send it to the CPU-only
    # index (see the comment further down).
    "torch>=2.4",
    # External knowledge sources
    "google-api-python-client>=2.150",
    # Persistence
    "pymongo>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    # starlette's TestClient asks for httpx2 and falls back to httpx with a deprecation
    # warning. The application itself still speaks httpx, and respx mocks that side; the
    # two clients do not meet.
    "httpx2>=0.29",
    "ruff>=0.7",
    "bandit>=1.7",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    # The two published figures are drawn by `scripts/build_figures.py`, through the
    # `figure_style`. The served backend never draws anything, so matplotlib is a
    # development dependency and stays out of the image.
    "matplotlib>=3.9",
    # `scripts/capture.py` drives the system Chrome through playwright: the interface draws
    # itself after the page settles, and a headless clock photographs it empty.
    "playwright>=1.47",
    # `scripts/run_notebooks.py` executes the notebook from a clean kernel and writes its
    # outputs back, which is what lets the published copy be one run rather than a history.
    "nbclient>=0.10",
    "nbformat>=5.10",
]

# sentence-transformers pulls in PyTorch. By default PyTorch ships with the
# whole CUDA runtime (about 8 GB of wheels) which is useless here: the
# embeddings are computed on CPU, inside a container that has no GPU. Pointing
# torch at the CPU-only index keeps the backend image around 2 GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_coach"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
    "N803", # allow FEN / SAN style argument names where natural
    "N806",
]

# A notebook spreads its imports across cells: the first one sets the environment up, and the
# ones that follow sit next to the code that uses them, which is what makes a notebook
# readable. It is linted, and these three rules are the ones that would ask it to stop.
[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.ipynb" = ["E402", "F401", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-branch --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: two real components of the repository wired together, or one against a real external dependency",
    "system: the product started the way the README says to start it, questioned through its public surface",
    "claim: fails when a published number, figure, table or artefact stops matching the code",
    "simulation: replays a complete scenario on frozen data, with no real service",
    "slow: takes long enough that a reader deserves to be told before running it",
]
# Warnings are errors. Three categories used to be silenced wholesale, which on a stack
# made of six fast-moving libraries meant never hearing that one of them was about to
# change its API. Every exemption below names the message it silences and the library it
# comes from.
filterwarnings = ["error"]

[tool.coverage.run]
# Without this, the published XML report writes the absolute root of the measured sources:
# a reader finds the directory tree of the machine that ran the suite, and two runs on two
# machines produce two different files for the same numbers.
relative_files = true
branch = true
source = ["src/chess_coach", "scripts"]
data_file = "var/.coverage"
omit = [
    # Copied in rather than imported, so a clone needs nothing extra to install, and tested
    # at their source. Measuring them here would report someone else's coverage as this
    # project's.
    "*/figure_style.py",
    "*/utils/paths.py",
    "scripts/run_notebooks.py",
    "scripts/smoke.py",
    "scripts/capture.py",
]

[tool.coverage.report]
# The floor is the rate measured on the day the suite was completed, rounded down. A floor
# below the current rate is not a floor: it lets the next commit lose coverage silently.
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
# Tracked: a published result a reader can open, and what the coverage badge recomputes from.
output = "reports/coverage/coverage.xml"

[tool.coverage.html]
# Not tracked: generated pages nobody reviews in a diff.
directory = "var/coverage-html"

[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]
# B101: assert is used for invariants in scripts/notebooks, not security checks.
# B113: external HTTP calls always pass an explicit timeout in the services layer.
skips = ["B101"]
